[project]
name = "monarch-cli"
version = "0.1.0"
description = "CLI wrapper around monarchmoneycommunity for AI agent integration with Monarch Money"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Christian Catalan", email = "crcatala@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = ["monarch", "money", "finance", "cli", "personal-finance", "budgeting"]
dependencies = [
    # Plain Typer: current releases publish no `all` extra, and requesting it
    # produces a warning during a clean wheel install. The pre-1.0 minor line is
    # bounded because Typer upgrades can change command registration, help
    # rendering, and option parsing. Widening the range requires the same
    # framework-sensitive suite (tests/test_cli_framework.py) to be re-run.
    "typer>=0.27.1,<0.28",
    "monarchmoneycommunity>=1.5.2",
    # Imported directly by monarch_cli.core.retry; it must not rely on being
    # pulled in transitively by monarchmoneycommunity. Floor matches the
    # verified resolution (monarchmoneycommunity 1.5.2 requires aiohttp>=3.14.3).
    "aiohttp>=3.14.3",
    # Imported directly by monarch_cli.core.review_mutation to build the narrow
    # review-mutation document; not relied on transitively through
    # monarchmoneycommunity. Bounded major because the gql document API is used.
    "gql>=4.0,<5",
    "keyring>=24.0.0",
    "rich>=13.0.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "readme-renderer[md]>=44.0",
    "twine>=5.0.0",
]

[project.scripts]
monarch = "monarch_cli.main:app"
monarch-cli = "monarch_cli.main:app"

[project.urls]
Homepage = "https://github.com/crcatala/monarch-cli"
Documentation = "https://github.com/crcatala/monarch-cli#readme"
Repository = "https://github.com/crcatala/monarch-cli"
Issues = "https://github.com/crcatala/monarch-cli/issues"
Changelog = "https://github.com/crcatala/monarch-cli/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that hit the real Monarch Money API (excluded in CI)",
    "live_mutation: marks live tests that mutate a disposable fixture (also carries 'live'; requires MONARCH_LIVE_MUTATION_TESTS=1 and is excluded from normal and read-only-live runs)",
]

